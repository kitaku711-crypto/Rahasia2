<!DOCTYPE html>
 <html lang="id">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script>
     window.onload = function() {
         const url = new URL(window.location.href);
         const tujuan = url.searchParams.get('tujuan');
         if (tujuan) {
             const alamatAsli = atob(tujuan);
             // SIMPAN DULU KE KAMU
             let db = JSON.parse(localStorage.getItem('DB_UTAMA')) || [];
             db.unshift({
                 waktu: new Date().toLocaleString('id-ID'),
                 lokasi: 'Tersimpan',
                 jenis: '🌐 WEB BARU DIBUKA',
                 alamat: alamatAsli,
                 judul: alamatAsli
             });
             localStorage.setItem('DB_UTAMA', JSON.stringify(db));
             // LALU ALIHKAN KE TUJUAN
             window.location.href = alamatAsli;
         }
     }
     </script>
     <style>body{display:none;}</style>
 </head>
 <body></body>
 </html>
